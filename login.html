<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to your DubeeShoes account">
  <title>Sign In — DubeeShoes</title>
  
  <link rel="stylesheet" href="src/css/tokens.css">
  <link rel="stylesheet" href="src/css/reset.css">
  <link rel="stylesheet" href="src/css/atoms.css">
  <link rel="stylesheet" href="src/css/molecules.css">
  <link rel="stylesheet" href="src/css/organisms.css">
</head>
<body>

  <main class="auth-page">
    <!-- Form Panel -->
    <section class="auth-panel">
      <div class="auth-form-container">
        <div class="auth-form-header">
          <a href="/" class="header-logo" style="margin-bottom: var(--space-8);"><img src="/images/logo.jpeg" alt="Atelier" height="40"></a>
          <span class="text-caption">Welcome Back</span>
          <h1 class="text-h2">Sign In</h1>
        </div>

        <form class="auth-form" id="loginForm" novalidate>
          <div class="form-field">
            <label for="email" class="form-label">Email Address</label>
            <input 
              type="email" 
              id="email" 
              name="email" 
              class="input" 
              placeholder="your@email.com"
              autocomplete="email"
              required
            >
            <span class="form-error" id="emailError" aria-live="polite"></span>
          </div>

          <div class="form-field">
            <label for="password" class="form-label">Password</label>
            <input 
              type="password" 
              id="password" 
              name="password" 
              class="input" 
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            >
            <span class="form-error" id="passwordError" aria-live="polite"></span>
          </div>

          <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">
            Sign In
          </button>

          <div class="auth-form-footer">
            <a href="#" class="link" style="font-size: var(--text-sm);">Forgot your password?</a>
            <p class="text-body" style="color: var(--color-text-muted);">
              Don't have an account? 
              <a href="register.html" class="link" style="color: var(--color-text-primary);">Create one</a>
            </p>
          </div>
        </form>
      </div>
    </section>

    <!-- Dark Panel -->
    <section class="auth-panel auth-panel-dark">
      <div style="text-align: center; max-width: 400px;">
        <span class="text-caption" style="color: var(--color-accent);">DubeeShoes</span>
        <h2 class="text-h2" style="color: var(--color-text-inverse); margin: var(--space-6) 0;">
          Crafted for Those Who Notice
        </h2>
        <p class="text-body-lg" style="color: var(--atelier-silver);">
          Join a community of discerning collectors who appreciate the quiet language 
          of exceptional craftsmanship.
        </p>
      </div>
    </section>
  </main>

  <script type="module" src="src/ts/validation.ts"></script>
  <script type="module" src="src/ts/auth.ts"></script>
</body>
</html>
